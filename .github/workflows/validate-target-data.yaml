name: Hub Target Data Validation (R)

# Validates the target data files a pull request adds or changes and posts the
# result on that pull request. Added with:
#
#   hubCI::use_hub_github_action("validate-target-data")

on:
  pull_request:
    branches: main
    paths:
      - 'target-data/time-series.*'
      - 'target-data/time-series/**'
      - 'target-data/oracle-output.*'
      - 'target-data/oracle-output/**'
      - '!**/README'
      - '!**/README.*'
      - '!**/readme'
      - '!**/readme.*'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-target-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # allow_extra_dates accepts time-series dates outside the
      # target_end_date values in tasks.json. Oracle output is still validated
      # strictly. See hubverse-org/hubValidations#296.
      - uses: hubverse-org/hubverse-actions/validate-target-data@v2
        with:
          date_col: target_end_date
          allow_extra_dates: true
