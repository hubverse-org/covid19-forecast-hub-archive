team_name: Karlen Working Group
team_abbr: Karlen
model_name: python Population Modeller
model_abbr: pypm
model_contributors:
- name: Dean Karlen
  affiliation: University of Victoria and TRIUMF
  email: karlen@uvic.ca
website_url: https://pypm.github.io/home/
license: gpl-3.0
citation: https://arxiv.org/abs/2007.07156
team_funding: none
team_model_designation: primary
model_details:
  methods: Discrete-time difference equations with long periods of constant transmission
    rate. Jan 16 2022 - include vaccine and natural escape (Omicron). Jan 23 2022
    - include boosters.
  data_inputs: NYT case and death data (starting Jan 16 2022), HHS hospitalization
    data (starting Nov 22, 2020), CDC vaccination data (incl. boosters)
ensemble_of_hub_models: no
