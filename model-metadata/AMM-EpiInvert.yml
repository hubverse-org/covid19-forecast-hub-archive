model_details:
  methods: Learning from the past a short time forecast of the COVID-19 incidence
    curve trend.
  methods_long: We design a learning procedure, EpiInvertForecast,  to forecast the
    future trend of the daily incidence. This learning procedure is based on a database
    of 27,418 incidence trend curves computed in the past, with EpiInvert, using real
    data. The forecast of the current incidence trend is obtained from the 27,418
    database  curves taking into account the similarity between the current curve
    and the database curve in the past. We also compute empirical confidence intervals
    for the forecast estimationand, using the weekly seasonality computed by EpiInvert,
    we also estimate a forecast of the original incidence curve.
  data_inputs: JHU
ensemble_of_hub_models: no
