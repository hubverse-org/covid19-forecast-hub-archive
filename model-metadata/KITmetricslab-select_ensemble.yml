model_details:
  methods: A weighted ensemble of iteratively preselected forecasts from the COVID-19
    Forecast Hub.
  methods_long: This is a weighted combination of the component model forecasts. All
    component models that provide all predictive quantiles at the current forecast
    date and also cover the previous four weeks are considered. First, the models
    are ranked by their performance (as per WIS) over the past four weeks. Then a
    linear combination of the best two methods is computed to minimize the mean WIS
    over all states. This combined forecast is then linearly combined with the third-best
    model to update the combined forecast. This is continued with the next best model
    until the weight of the next model is less than 1/(2*number_of_models). Finally,
    a linear combination of the selected models is refitted with the previously computed
    weights as starting vector. No observed data after Monday is used for estimation.
  data_inputs: Cumulative/incident death and case forecasts from other models.
ensemble_of_hub_models: yes
