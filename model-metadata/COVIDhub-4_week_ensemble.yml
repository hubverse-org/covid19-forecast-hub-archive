model_details:
  methods: An ensemble, or model average, of submitted forecasts to the COVID-19 Forecast
    Hub.
  methods_long: This model, first run 2021-09-06, continues the the practice of making
    1-4 week (or 1-28 day) predictions for all targets handled by the hub, whereas
    the operational COVIDHub ensemble forecast no longer includes predictions for
    incident cases at 3 and 4 weeks. This 4-week ensemble forecast is only meant to
    be used for research purposes and is not intended for direct public communication
    or policy guidance.
  data_inputs: cumulative and incident death forecasts from other models.
ensemble_of_hub_models: yes
