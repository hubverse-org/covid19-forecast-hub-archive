model_details:
  methods: SEIR model forecasts of cumulative deaths, incident deaths, incident hospitalizations  by
    fitting predicted cases, deaths, and hospitalizations to the observations.
  methods_long: 'The SEIR Model makes forecast of cumulative deaths, incident deaths,
    incident hospitalizations by fitting predicted cases, deaths, and hospitalizations
    to the observations. Quantiles of the forecast are derived from forecast error
    (comparing latest observation and corresponding forecast) rescaled based on days
    forward of forecast. '
  data_inputs: NYTimes for case and death data
ensemble_of_hub_models: no
